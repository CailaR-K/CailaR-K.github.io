document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

der-b);\n  --border-focus:   var(--teal);\n\n  --text-primary:   var(--ink);\n  --text-secondary: var(--ink-2);\n  --text-tertiary:  var(--ink-3);\n  --text-inverse:   rgba(255,255,255,.92);\n  --text-inverse-2: rgba(255,255,255,.55);\n  --text-inverse-3: rgba(255,255,255,.32);\n\n  --link-color: var(--teal);\n  --link-hover: #2D6A67;\n\n  /* Overlays */\n  --overlay-scrim:      rgba(44,32,24,.52);\n  --overlay-scrim-strong: rgba(44,32,24,.78);\n  --overlay-veil:       rgba(242,237,228,.74);\n}\n\n/* ── Dark mode ──\n   Apply by adding data-theme=\"dark\" to <html> or any container.\n   Brand hues stay put (lightened slightly for contrast on dark surfaces);\n   neutrals/surfaces/text/borders flip to a warm charcoal scale — never cool gray. */\n[data-theme=\"dark\"] {\n  --slate:  #5A6670;\n  --olive:  #7A8F73;\n  --amber:  #D9A06E;\n  --terra:  #C57A5C;\n  --teal:   #56A6A2;\n  --forest: #4C9143;\n\n  --clay:   #21201D;   /* app canvas background */\n  --parch:  #2A2825;   /* recessed surface */\n  --linen:  #3C3934;   /* border, divider */\n  --border-b: #4E4A43;  /* stronger border / hover border */\n  --white:  #2E2C28;   /* card/surface (renamed role, not literal white) */\n\n  --ink:    #F2ECE2;   /* primary text */\n  --ink-2:  #C9BFB0;   /* secondary text */\n  --ink-3:  #8F8578;   /* tertiary / placeholder / meta text */\n\n  --color-success-bg:   rgba(76,145,67,.16);\n  --color-warning-bg:   rgba(217,160,110,.16);\n  --color-error-bg:     rgba(197,122,92,.16);\n  --color-info-bg:      rgba(86,166,162,.16);\n\n  --bg-canvas:    var(--clay);\n  --bg-recessed:  var(--parch);\n  --bg-surface:   var(--white);\n  --bg-inverse:   #14100C;\n\n  --border-default: var(--linen);\n  --border-strong:  var(--border-b);\n\n  --text-primary:   var(--ink);\n  --text-secondary: var(--ink-2);\n  --text-tertiary:  var(--ink-3);\n  --text-inverse:   rgba(20,16,12,.92);\n  --text-inverse-2: rgba(20,16,12,.55);\n  --text-inverse-3: rgba(20,16,12,.32);\n\n  --link-hover: #7FC4C0;\ tion:none\">Spacing &amp; Layout<\u002Fa>\n      <a href=\"#f-grid\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Grid System<\u002Fa>\n      <a href=\"#f-radius\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Radius, Shadow, Blur &amp; Z-Index<\u002Fa>\n      <a href=\"#f-motion\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Motion<\u002Fa>\n      <a href=\"#f-icon\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Iconography<\u002Fa>\n      <a href=\"#components\" style=\"display:block;padding:7px 10px;border-radius:6px;font-size:12px;color:rgba(255,255,255,.85);text-decoration:none;font-weight:500;margin-top:8px\">3 · Components<\u002Fa>\n      <a href=\"#c-nav-primary\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Navigation<\u002Fa>\n      <a href=\"#c-actions\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Buttons<\u002Fa>\n      <a href=\"#c-inputs\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Inputs &amp; Controls<\u002Fa>\n      <a href=\"#c-metadata\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Badges &amp; Pills<\u002Fa>\n      <a href=\"#c-overlays-messaging\" style=\"display:block;padding:5px 10px 5px 20px;border-radius:6px;font-size:11.5px;color:rgba(255,255,255,.55);text-decoration:none\">Overlays &amp; Messaging<\u002Fa>\n      <a href=\"#c-data-tables\" =\"flex:1;min-width:0\">\n\n    <!-- AUDIENCE BANNER -->\n    <sc-if value=\"{{ hasBanner }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:var(--teal);color:white;padding:10px 24px;font-size:12.5px;font-weight:500;text-align:center;position:sticky;top:0;z-index:5\">{{ bannerLabel }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ═══ COVER ═══ -->\n    <div style=\"background:linear-gradient(150deg,var(--slate),#3a434b);padding:96px 72px 72px;color:white;position:relative;overflow:hidden\">\n      <div style=\"position:absolute;right:-60px;top:-60px;width:280px;height:280px;background:var(--teal);border-radius:50%;opacity:.12\"><\u002Fdiv>\n      <div style=\"position:absolute;left:60px;bottom:-70px;width:200px;height:200px;background:var(--amber);border-radius:50%;opacity:.10\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:780px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:28px\">\n          <div style=\"display:flex;align-items:center;gap:2px\"><div style=\"width:14px;height:22px;background:rgba(255,255,255,.9);border-radius:0 11px 11px 0\"><\u002Fdiv><div style=\"width:20px;height:20px;background:var(--amber);border-radius:50%\"><\u002Fdiv><div style=\"width:14px;height:22px;background:rgba(255,255,255,.9);border-radius:11px 0 0 11px\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:500;color:rgba(255,255,255,.95)\">MaraSpace<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-serif);font-size:52px;line-height:1.08;letter-spacing:-.01em;margin-bottom:16px\">Design System<\u002Fdiv>\n        <div style=\"font-size:16px;color:rgba(255,255,255,.7);line-height:1.65;max-width:600px;margin-bottom:32px\">A single source of truth for MaraSpace's visual language, components, and patterns — reverse-engineered from production mockups and maintained as the product grows.<\u002Fdiv>\n        <div style=\"display:flex;gap:36px;flex-wrap:wrap;padding-top:24px;border-top:1px solid rgba(255,255,255,.14)\">\n          <div><div style=\"font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px\">Version<\u002Fdiv><div style=\"font-size:14px;color:rgba(255,255,255,.9)\">1.0<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px\">Last Updated<\u002Fdiv><div style=\"font-size:14px;color:rgba(255,255,255,.9)\">July 15, 2026<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px\">Owner<\u002Fdiv><div style=\"font-size:14px;color:rgba(255,255,255,.9)\">MaraSpace Team<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px\">Creator<\u002Fdiv><div style=\"font-size:14px;color:rgba(255,255,255,.9)\">Caila Robson-Kullman<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px\">Status<\u002Fdiv><div style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#9ED18C;font-weight:500\"><span style=\"width:6px;height:6px;border-radius:50%;background:#9ED18C;display:inline-block\"><\u002Fspan>Living document<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ═══ 1. INTRODUCTION ═══ -->\n    <div style=\"background:rgba(255,255,255,.5)\"><div id=\"intro\" style=\"padding:64px 72px 56px;max-width:900px\">\n      <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:10px\">Section 1<\u002Fdiv>\n      <div style=\"font-family:var(--font-serif);font-size:34px;color:var(--slate);margin-bottom:18px\">Introduction<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.8;color:var(--ink-2);margin-bottom:28px\">This is MaraSpace's design reference — the shared vocabulary designers, engineers, and stakeholders use to build and evaluate the product consistently. It's grounded in six existing production-quality mockups (onboarding, admin onboarding, dashboard, tour, customers, and a shared spec doc), so everything here reflects what's actually shipping, not an aspirational redesign.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px\">\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:22px 24px\">\n          <div style=\"font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px\">Purpose &amp; Goals<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--ink-2);line-height:1.7\">Give every contributor a single, visual reference for MaraSpace's colors, type, spacing, components, and patterns — so new screens feel native on day one, not after three rounds of review.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:22px 24px\">\n          <div style=\"font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px\">Who it's for<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--ink-2);line-height:1.7\">Product designers (visual + interaction reference), engineers (token &amp; component implementation), and stakeholders (a shared vocabulary for feedback).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(61,125,122,.07);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:16px 20px;margin-top:16px\">\n        <div style=\"font-size:12px;font-weight:600;color:var(--teal);margin-bottom:6px\">Design Principles<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--ink-2);line-height:1.75\"><strong style=\"color:var(--ink);font-weight:500\">Warm over corporate<\u002Fstrong> — earthy, editorial tones instead of cool SaaS gray. <strong style=\"color:var(--ink);font-weight:500\">Clarity over density<\u002Fstrong> — every screen shows real data at a glance, with room to breathe. <strong style=\"color:var(--ink);font-weight:500\">Consistent by design<\u002Fstrong> — Mara looks and behaves the same in every surface, building trust through familiarity. <strong style=\"color:var(--ink);font-weight:500\">Concrete over generic<\u002Fstrong> — real names, numbers, and order IDs in every example, never lorem ipsum.<\u002Fdiv>\n      <\u002Fdiv>\n      \n    <\u002Fdiv><\u002Fdiv>\n\n    \n\n    <div style=\"height:1px;background:var(--linen)\"><\u002Fdiv>\n\n<!-- ═══ 2. FOUNDATIONS ═══ -->\n    <div id=\"foundations\" style=\"padding:56px 72px 8px;max-width:1100px\">\n      <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:10px\">Section 2<\u002Fdiv>\n      <div style=\"font-family:var(--font-serif);font-size:34px;color:var(--slate);margin-bottom:8px\">Foundations<\u002Fdiv>\n      <div style=\"font-size:14px;color:var(--ink-2);line-height:1.7;max-width:700px\">The visual atoms every screen is built from — color, type, spacing, and radius. Treat these as fixed: reach for what's documented here before introducing anything new.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- COLOR -->\n    <div id=\"f-color\" style=\"padding:36px 72px;max-width:1100px\">\n      <div style=\"font-family:var(--font-serif);font-size:22px;color:var(--slate);margin-bottom:6px\">Color<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--ink-2);margin-bottom:20px;max-width:680px\">An earthy, stone-and-parchment neutral scale paired with six brand hues — each hue tied to one job, never used interchangeably.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(6,1fr);ga div style=\"position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px\"><div style=\"backdrop-filter:blur(var(--blur-sm));background:rgba(255,255,255,.35);border-radius:6px;padding:5px 9px;font-size:10px;color:var(--ink)\">Light image · sm 4px<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;width:150px;height:90px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--slate),#222b32)\">\n          <div style=\"position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px\"><div style=\"backdrop-filter:blur(var(--blur-md));background:rgba(0,0,0,.35);border-radius:6px;padding:5px 9px;font-size:10px;color:#fff\">Dark image · md 8px<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:150px;height:90px;border-radius:8px;background:linear-gradient(135deg,#E9DFC9,#C8BAA8);display:flex;align-items:center;justify-content:center\"><div style=\"width:110px;height:60px;backdrop-filter:blur(var(--blur-lg));background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:8px\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:10px;color:var(--ink-3);margin-top:6px\">Glass panel · lg 20px<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--ink-3);margin-top:10px;margin-bottom:24px\">Tokens: <span style=\"font-family:monospace;background:var(--parch);padding:2px 6px;border-radius:4px\">--blur-sm<\u002Fspan> 4px, <span style=\"font-family:monospace;background:var(--parch);padding:2px 6px;border-radius:4px\">--blur-md<\u002Fspan> 8px, <span style=\"font-family:monospace;background:var(--parch);padding:2px 6px;border-radius:4px\">--blur-lg<\u002Fspan> 20px.<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;color:var(--ink);margin-bottom:10px\">Z-Index Scale<\u002Fdiv>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px\">\n        <sc-raw-thead><sc-raw-tr style=\"background:transparent\"><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Token<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Value<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Used for<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--z-raised<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen)\">10<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);color:var(--ink-2)\">Sticky table headers, raised cards<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--z-dropdown<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen)\">100<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);color:var(--ink-2)\">Dropdowns, popovers, tooltips<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--z-sticky<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen)\">200<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);color:var(--ink-2)\">Sticky topbar / step-bar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--z-drawer<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen)\">500<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);color:var(--ink-2)\">Ask Mara drawer, side drawers<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--z-modal<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen)\">900<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;border-bottom:1px solid var(--linen);color:var(--ink-2)\">Modal dialogs + scrim<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 14px;font-family:monospace\">--z-toast<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px\">1000<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 14px;color:var(--ink-2)\">Toasts/notifications — always on top<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv><\u002Fdiv>\n\n    <!-- MOTION -->\n    <div id=\"f-motion\" style=\"padding:36px 72px;max-width:1100px\">\n      <div style=\"font-family:var(--font-serif);font-size:22px;color:var(--slate);margin-bottom:6px\">Motion<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--ink-2);margin-bottom:16px;max-width:680px\">Short and soft — nothing bounces. Drawers and overlays ease with <span style=\"font-family:monospace\">cubic-bezier(0.4,0,0.2,1)<\u002Fspan>, hovers with plain <span style=\"font-family:monospace\">ease<\u002Fspan> at 100–150ms.<\u002Fdiv>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:20px;table-layout:fixed\">\n        \n        <sc-raw-thead><sc-raw-tr style=\"background:transparent\"><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Token<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Duration<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Used for<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--duration-instant<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">50ms<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">Pressed/active state feedback<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--duration-fast<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">100ms<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">Hover background changes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--duration-base<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">150ms<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">Buttons, borders, filters<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--duration-slow<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">250ms<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">Toast/alert fade + collapse<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;font-family:monospace\">--duration-slowest<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px\">400ms<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px\">Ask Mara drawer, Focus Centre slide-in<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed\">\n        \n        <sc-raw-thead><sc-raw-tr style=\"background:transparent\"><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Easing token<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Curve<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--linen)\">Used for<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--ease-in<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">cubic-bezier(.4,0,1,1)<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">Elements leaving the screen<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen);font-family:monospace\">--ease-out<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">cubic-bezier(0,0,.2,1)<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;border-bottom:1px solid var(--linen)\">Elements entering the screen<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;font-family:monospace\">--ease-in-out<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px\">cubic-bezier(.4,0,.2,1)<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px\">Drawers, overlays, most transitions<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n\n      <div style=\"font-size:11px;font-weight:600;color:var(--ink);margin:24px 0 12px\">Component Animation<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px\">\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:16px\">\n          <div style=\"font-size:11px;font-weight:600;color:var(--ink);margin-bottom:6px\">Modal — Enter / Exit<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--ink-2);line-height:1.5\">Backdrop fades in over <span style=\"font-family:monospace\">--duration-base<\u002Fspan>. Modal scales from 96% → 100% + fades, <span style=\"font-family:monospace\">--ease-out<\u002Fspan>. Exit reverses at <span style=\"font-family:monospace\">--duration-fast<\u002Fspan>, <span style=\"font-family:monospace\">--ease-in<\u002Fspan>.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:16px\">\n          <div style=\"font-size:11px;font-weight:600;color:var(--ink);margin-bottom:6px\">Toast Stack<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--ink-2);line-height:1.5\">New toasts slide up + fade in (<span style=\"font-family:monospace\">--duration-slow<\u002Fspan>, <span style=\"font-family:monospace\">--ease-out<\u002Fspan>). Existing toasts shift up smoothly to make room. Dismiss collapses height then fades.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:16px\">\n          <div style=\"font-size:11px;font-weight:600;color:var(--ink);margin-bottom:6px\">Drawers — Slide<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--ink-2);line-height:1.5\">Slide in from the edge they're anchored to (right for Focus Centre, bottom for mobile sheets) over <span style=\"font-family:monospace\">--duration-slowest<\u002Fspan>, <span style=\"font-family:monospace\">--ease-in-out<\u002Fspan>. Backdrop fades in parallel.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:16px\">\n          <div style=\"font-size:11px;font-weight:600;color:var(--ink);margin-bottom:6px\">Mobile — Swipe, Pull, Tap<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--ink-2);line-height:1.5\">Swipe-to-dismiss tracks the finger 1:1, no easing until release. Pull-to-refresh rubber-bands past threshold, then springs to the loading state. Taps get an instant <span style=\"font-family:monospace\">--duration-instant<\u002Fspan> opacity dip for feedback.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- ICONOGRAPHY -->\n    <div style=\"background:#FFFFFF80\"><div id=\"f-icon\" style=\"padding: 36px 72px; max-width: 1100px\">\n      <div style=\"font-family:var(--font-serif);font-size:22px;color:var(--slate);margin-bottom:6px\">Iconography<\u002Fdiv>\n      \n\n      <div style=\"font-size:13px;color:var(--ink-2);margin-bottom:24px;max-width:680px\">Hand-drawn inline SVG, 16–20px, 1.3px stroke, outlined rather than filled, always <span style=\"font-family:monospace\">currentColor<\u002Fspan> — never an icon font.<\u002Fdiv><div style=\"font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px\">Examples<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(8,1fr);gap:14px;background:white;border:1px solid var(--linen);border-radius: rgin-bottom:6px\">Keyboard &amp; focus<\u002Fdiv><div style=\"font-size:12px;color:var(--ink-2);line-height:1.6\">Escape closes the Ask Mara drawer and Focus Centre; tab order follows visual order (topbar → sidebar → main → right panel).<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:18px 20px\"><div style=\"font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px\">Reduced motion<\u002Fdiv><div style=\"font-size:12px;color:var(--ink-2);line-height:1.6\">All transitions are opacity/transform-based and short (≤300ms) — wrap in prefers-reduced-motion to disable drawer slide/fade for sensitive users.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:18px 20px\"><div style=\"font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px\">Screen readers &amp; ARIA<\u002Fdiv><div style=\"font-size:12px;color:var(--ink-2);line-height:1.6\">Icon-only buttons need aria-label (e.g. \"More options\"); status dots need visually-hidden text (not color alone); the Ask Mara drawer should be role=\"dialog\" with aria-modal and trap focus while open.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:white;border:1px solid var(--linen);border-radius:var(--radius-card);padding:18px 20px\"><div style=\"font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px\">Color blindness<\u002Fdiv><div style=\"font-size:12px;color:var(--ink-2);line-height:1.6\">Status (Hot/Warm/Cold) always pairs a color dot with a text label — never color alone. Charts use position/pattern, not just hue, to separate series.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      \n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n        \n        \n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n\n    \n\n    <div style=\"height:1px;background:var(--linen)\"><\u002Fdiv>\n\n<!-- ═══ 5. DEVELOPER HAN
